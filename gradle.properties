org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Build-log noise suppression (cosmetic only; no behaviour change) ---
# compileSdk 35 is intentional and tested; AGP 8.5.2 only warns that it was validated
# against 34. Revisit when upgrading AGP (see BUILD_NOTES.md).
android.suppressUnsupportedCompileSdk=35
# Java source/target 8 is required for the desugaring configuration on minSdk 21;
# JDK 21 warns that 8 is obsolete. The compile target is deliberate.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
