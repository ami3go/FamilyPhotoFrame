name: Collage Feature Bootstrap

on:
  push:
    branches:
      - agent/collage-optimizer

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/collage-optimizer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare integration patch helper
        run: python3 tools/fix_collage_patch_helper.py

      - name: Apply integration wiring
        run: python3 tools/collage_feature_patch.py

      - name: Verify SQL contracts
        run: python3 scripts/verify-sql.py

      - name: Compile and run JVM tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin

      - name: Check patch whitespace
        run: git diff --check

      - name: Publish verified production patch
        run: |
          rm tools/collage_feature_patch.py
          rm tools/fix_collage_patch_helper.py
          rm .github/workflows/collage-feature-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire collage optimizer into preparation and rendering"
          git push origin HEAD:agent/collage-optimizer
