name: Verify manual Next prewarm
on:
  push:
    branches: [agent/manual-next-prewarm-ci]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch control-dock next prewarm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowScreen.kt')
          s = p.read_text()
          def rep(old, new, count=1):
              global s
              actual = s.count(old)
              assert actual >= count, f'missing patch target ({actual} < {count}): {old[:120]!r}'
              s = s.replace(old, new, count)

          rep(
              '''            val existingHandle = cachedHandle?.takeIf { handle ->\n                handle == committedHandle || slide(handle)?.let {\n                    !softFocusNeeded || it.transitionBlurredBitmap != null\n                } == true\n            }''',
              '''            val existingHandle = cachedHandle?.takeIf { handle ->\n                handle == committedHandle ||\n                    (fastManual && slide(handle) != null) ||\n                    slide(handle)?.let { !softFocusNeeded || it.transitionBlurredBitmap != null } == true\n            }'''
          )

          rep(
              '''        memoryProtection.decisionVersion,\n        hostActive,\n        hostGeneration,\n    ) {\n        val photo = next ?: return@LaunchedEffect''',
              '''        memoryProtection.decisionVersion,\n        manualNavigationActive,\n        hostActive,\n        hostGeneration,\n    ) {\n        val photo = next ?: return@LaunchedEffect\n        val prewarmManual = manualNavigationActive && committedHandle != null'''
          )

          rep(
              '''        val existingHandle = registry.latest(photo.id)?.takeIf { handle ->\n            slide(handle)?.let { !softFocusNeeded || it.transitionBlurredBitmap != null } == true\n        }\n        if (existingHandle != null) return@LaunchedEffect\n        when (val result = build(photo)) {''',
              '''        val existingHandle = registry.latest(photo.id)?.takeIf { handle ->\n            slide(handle)?.let {\n                prewarmManual || !softFocusNeeded || it.transitionBlurredBitmap != null\n            } == true\n        }\n        if (existingHandle != null) return@LaunchedEffect\n        when (val result = build(photo, fastManual = prewarmManual)) {'''
          )
          p.write_text(s)
          PY
      - name: Structural checks
        run: |
          git diff --check
          grep -q 'val prewarmManual = manualNavigationActive && committedHandle != null' app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowScreen.kt
          grep -q 'build(photo, fastManual = prewarmManual)' app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowScreen.kt
          grep -q '(fastManual && slide(handle) != null)' app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowScreen.kt
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Commit verified source
        if: success()
        run: |
          git config user.name ami3go
          git config user.email 69671996+ami3go@users.noreply.github.com
          git add app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowScreen.kt
          git commit -m 'perf: prewarm manual next presentation [skip ci]'
          git push origin HEAD:agent/manual-next-prewarm-ci
