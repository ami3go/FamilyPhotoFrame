name: Verify stability refactor

on:
  push:
    branches:
      - agent/stability-refactor-ci

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply refactor patch
        run: |
          python3 tools/agent_stability_refactor.py
          python3 tools/agent_stability_refactor_fix1.py
      - name: Check whitespace
        run: git diff --check
      - name: Verify obsolete runtime code is gone
        run: |
          ! grep -R "FolderCycleQueue\|LeastRecentRandom\|FolderBalancedPlaybackQueue" app/src/main
          ! grep -R "SelectionMode.LEAST_RECENT_RANDOM" app/src/main
          ! grep -n "fun setSleepEnabled\|fun setSleepStart\|fun setSleepEnd" app/src/main/java/com/example/familyphotoframe/ui/slideshow/SlideshowViewModel.kt
      - name: Verify DAO SQL
        run: python3 scripts/verify-sql.py
      - name: Run unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main app/src/test
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "refactor: retire legacy playback paths and harden settings [skip ci]"
          git push
